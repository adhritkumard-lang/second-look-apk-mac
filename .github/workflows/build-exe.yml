name: Build Second Look for Windows (single file)

# Everything needed to build the app is inside this one file.
# Put it in a new GitHub repository at:  .github/workflows/build-exe.yml

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the project files
        shell: bash
        run: |
          set -e
          mkdir -p scripts web build
          cat > package.json <<'__SL_EOF__'
          {
            "name": "second-look",
            "productName": "Second Look",
            "version": "1.0.0",
            "description": "Check whether a message is a scam",
            "main": "main.js",
            "author": "Second Look",
            "license": "UNLICENSED",
            "private": true,
            "scripts": {
              "prepare-data": "node scripts/get-tessdata.js",
              "start": "npm run prepare-data && electron .",
              "dist": "npm run prepare-data && electron-builder --win --x64 --publish never"
            },
            "dependencies": {
              "tesseract.js": "^5.1.1"
            },
            "devDependencies": {
              "electron": "^31.0.0",
              "electron-builder": "^24.13.3"
            },
            "build": {
              "appId": "com.secondlook.desktop",
              "productName": "Second Look",
              "asar": false,
              "files": [
                "main.js",
                "preload.js",
                "web/**/*",
                "tessdata/**/*",
                "package.json"
              ],
              "directories": {
                "buildResources": "build",
                "output": "dist"
              },
              "win": {
                "icon": "build/icon.png",
                "target": [
                  { "target": "nsis", "arch": ["x64"] },
                  { "target": "portable", "arch": ["x64"] }
                ]
              },
              "nsis": {
                "oneClick": true,
                "perMachine": false,
                "artifactName": "SecondLook-Setup.exe"
              },
              "portable": {
                "artifactName": "SecondLook-Portable.exe"
              }
            }
          }
          __SL_EOF__
          cat > main.js <<'__SL_EOF__'
          const { app, BrowserWindow, ipcMain, shell } = require('electron');
          const path = require('path');
          const fs = require('fs');

          if (!app.requestSingleInstanceLock()) {
            app.quit();
          }

          let win = null;

          function isExternal(url) {
            return /^(https?|mailto):/i.test(url);
          }

          function createWindow() {
            win = new BrowserWindow({
              width: 1100,
              height: 860,
              minWidth: 480,
              minHeight: 600,
              backgroundColor: '#f7f3ff',
              autoHideMenuBar: true,
              title: 'Second Look',
              webPreferences: {
                preload: path.join(__dirname, 'preload.js'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            win.loadFile(path.join(__dirname, 'web', 'index.html'));

            // Links to other websites open in the normal browser, not inside the app.
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (isExternal(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.webContents.on('will-navigate', (event, url) => {
              if (!url.startsWith('file://')) {
                event.preventDefault();
                if (isExternal(url)) shell.openExternal(url);
              }
            });
          }

          app.whenReady().then(createWindow);

          app.on('second-instance', () => {
            if (win) {
              if (win.isMinimized()) win.restore();
              win.focus();
            }
          });

          app.on('window-all-closed', () => app.quit());

          // ---------- Reading text from a picture, on this computer ----------

          let workerPromise = null;

          function getWorker() {
            if (!workerPromise) {
              workerPromise = (async () => {
                const { createWorker } = require('tesseract.js');
                return createWorker('eng', 1, {
                  langPath: path.join(__dirname, 'tessdata'),
                  gzip: false,
                  cacheMethod: 'none'
                });
              })();
              workerPromise.catch(() => { workerPromise = null; });
            }
            return workerPromise;
          }

          function logError(err) {
            try {
              fs.appendFileSync(
                path.join(app.getPath('userData'), 'ocr-error.log'),
                new Date().toISOString() + ' ' + String((err && err.stack) || err) + '\n'
              );
            } catch (e) { /* ignore */ }
          }

          ipcMain.handle('ocr', async (_event, dataUrl) => {
            try {
              const comma = String(dataUrl).indexOf(',');
              if (comma < 0) return { text: '', error: 'unreadable' };
              const buffer = Buffer.from(String(dataUrl).slice(comma + 1), 'base64');
              const worker = await getWorker();
              const result = await worker.recognize(buffer);
              return { text: ((result && result.data && result.data.text) || '').trim() };
            } catch (err) {
              logError(err);
              return { text: '', error: 'failed' };
            }
          });

          app.on('before-quit', async () => {
            try {
              if (workerPromise) {
                const worker = await workerPromise;
                await worker.terminate();
              }
            } catch (e) { /* ignore */ }
          });
          __SL_EOF__
          cat > preload.js <<'__SL_EOF__'
          const { contextBridge, ipcRenderer } = require('electron');

          contextBridge.exposeInMainWorld('SecondLookDesktop', {
            ocr: (dataUrl) => ipcRenderer.invoke('ocr', dataUrl)
          });
          __SL_EOF__
          cat > scripts/get-tessdata.js <<'__SL_EOF__'
          // Downloads the English text-recognition data once, so the app can read pictures offline.
          const fs = require('fs');
          const path = require('path');

          const dir = path.join(__dirname, '..', 'tessdata');
          const file = path.join(dir, 'eng.traineddata');
          const urls = [
            'https://github.com/tesseract-ocr/tessdata_best/raw/main/eng.traineddata',
            'https://github.com/tesseract-ocr/tessdata_best/raw/master/eng.traineddata',
            'https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata',
            'https://github.com/tesseract-ocr/tessdata_fast/raw/master/eng.traineddata'
          ];

          async function main() {
            if (fs.existsSync(file) && fs.statSync(file).size > 1000000) {
              console.log('Text recognition data already present.');
              return;
            }
            fs.mkdirSync(dir, { recursive: true });
            for (const url of urls) {
              try {
                console.log('Downloading', url);
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const buf = Buffer.from(await res.arrayBuffer());
                if (buf.length < 1000000) throw new Error('file too small');
                fs.writeFileSync(file, buf);
                console.log('Saved', buf.length, 'bytes to', file);
                return;
              } catch (err) {
                console.log('  failed:', err.message);
              }
            }
            console.error('Could not download the text recognition data.');
            process.exit(1);
          }

          main();
          __SL_EOF__
