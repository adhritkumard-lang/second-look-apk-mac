      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build the Windows programs
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: SecondLook-Windows
          path: |
            dist/SecondLook-Setup.exe
            dist/SecondLook-Portable.exe

      - name: Publish a download link (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          name: Second Look for Windows (latest)
          body: Download SecondLook-Setup.exe to install, or SecondLook-Portable.exe to run without installing.
          files: |
            dist/SecondLook-Setup.exe
            dist/SecondLook-Portable.exe
